name: Publish - build and upload Python package to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # release versions only, e.g. v0.18.0, not v0.18.1-dev0

jobs:
  # Runs before anything is published: a version on PyPI cannot be withdrawn.
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Extract the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "${TAG#v}" > notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: notes.md

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build release distributions
        run: |
          python3 -m pip install build
          python3 -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    runs-on: ubuntu-latest

    needs:
      - release-notes
      - build

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    
    environment:
      name: pypi
      url: https://pypi.org/project/enocean-async

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    runs-on: ubuntu-latest

    # only once the version is on PyPI
    needs:
      - publish-to-pypi

    permissions:
      contents: write

    steps:
      - name: Retrieve release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
