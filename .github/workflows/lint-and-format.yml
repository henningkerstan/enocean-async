name: Lint, format and test
# pull_request as well: a push to a contributor's fork does not run the workflows of this repository
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Update output format to enable automatic inline annotations.
      - name: Run Ruff
        run: ruff check --output-format=github .
      # the files the ruff-format hook in .pre-commit-config.yaml formats
      - name: Check formatting
        run: ruff format --check enocean_async
      - name: Run tests
        run: pytest -q
